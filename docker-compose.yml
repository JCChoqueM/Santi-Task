services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: claudetask_php
    ports:
      - "8082:80"
      - "5173:5173"  # ← agregar este puerto para Vite
    volumes:
      - .:/var/www/html
      - ./docker/apache.conf:/etc/apache2/sites-available/000-default.conf
    working_dir: /var/www/html
    command: >
      bash -c "
        if [ ! -d 'vendor' ]; then
          echo '>>> Instalando dependencias de Composer...' &&
          composer install --no-interaction --prefer-dist
        else
          echo '>>> vendor/ ya existe, saltando Composer'
        fi &&

        if [ ! -d 'node_modules' ]; then
          echo '>>> Instalando dependencias de NPM...' &&
          npm install
        else
          echo '>>> node_modules/ ya existe, saltando NPM'
        fi &&

        echo '>>> Todo listo. Iniciando Apache...' &&
        apache2-foreground
      "
    depends_on:
      - mysql
    networks:
      - claudetask_network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: claudetask_mysql
    environment:
      # Los valores salen de .env (Compose lo lee solo). Sin ellos, Compose se detiene con el mensaje.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: claudetask
      # Los usa docker/initdb/02-usuario.sh para crear el usuario de la aplicacion
      DB_USER: ${DB_USER:?Falta DB_USER en .env}
      DB_PASS: ${DB_PASS:?Falta DB_PASS en .env}
    volumes:
      - claudetask_mysql_data:/var/lib/mysql
      # Solo estos dos archivos (antes se montaba todo el proyecto, con el .env). Se ejecutan
      # una sola vez, cuando el volumen esta vacio, en orden alfabetico.
      - ./claudetask.sql:/docker-entrypoint-initdb.d/01-claudetask.sql:ro
      - ./docker/initdb/02-usuario.sh:/docker-entrypoint-initdb.d/02-usuario.sh:ro
    ports:
      # Solo desde este equipo
      - "127.0.0.1:3308:3306"
    networks:
      - claudetask_network
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password

volumes:
  claudetask_mysql_data:

networks:
  claudetask_network:
    driver: bridge